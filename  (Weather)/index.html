<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Application</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">
    <h1>Weather Application</h1>
    <p class="subtitle">Enter a ZIP code to see the weather forecast.</p>

    <div class="search-box">
        <input type="text" id="zipInput" placeholder="Enter ZIP Code" maxlength="5">
        <button id="searchBtn">Search</button>
    </div>

    <p id="errorMsg"></p>

    <div id="weatherCard" class="weather-card hidden">
        <h2 id="locationName"></h2>

        <div class="current-weather">
            <img id="weatherIcon" alt="Weather Icon">
            <div>
                <p id="currentTemp"></p>
                <p id="weatherDesc"></p>
            </div>
        </div>

        <h3>5-Day Forecast</h3>
        <div id="forecastContainer" class="forecast"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
