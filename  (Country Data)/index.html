<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive 3D Globe</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            background-color: #111;
            color: white;
            margin: 0;
            padding: 20px;
        }

        /* The Container: This acts as the 'window' for the globe */
        #map-container {
            width: 600px;
            height: 600px;
            margin: 0 auto;
            overflow: hidden; /* Clips anything that grows too large */
            border-radius: 50%; /* Keeps the container shape circular */
            background: radial-gradient(circle, #222 0%, #000 100%);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            position: relative;
        }

        svg {
            cursor: grab;
            display: block;
        }

        svg:active {
            cursor: grabbing;
        }

        .country {
            fill: #d2d2d2;
            stroke: #fff;
            stroke-width: 0.3px;
        }

        .graticule {
            fill: none;
            stroke: rgba(255, 255, 255, 0.15);
            stroke-width: 0.5px;
            pointer-events: none;
        }

        #info {
            width: 450px;
            margin: 30px auto;
            text-align: left;
            background-color: #fff;
            color: #333;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        #details img {
            display: block;
            margin-bottom: 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<h1>Interactive Earth Explorer</h1>

<div id="map-container">
    <div id="map"></div>
</div>

<div id="info">
    <h2>Country Details</h2>
    <div id="details">Click a country to explore. Drag to rotate, scroll to zoom.</div>
</div>

<script>
    const width = 600;
    const height = 600;
    let rotationTimer;
    const baseScale = 250; // Initial size

    const svg = d3.select("#map")
        .append("svg")
        .attr("width", width)
        .attr("height", height)
        // viewBox ensures the coordinate system stays fixed
        .attr("viewBox", `0 0 ${width} ${height}`);

    const projection = d3.geoOrthographic()
        .scale(baseScale)
        .translate([width / 2, height / 2])
        .clipAngle(90);

    const path = d3.geoPath().projection(projection);

    // Define the circular mask for the land
    const defs = svg.append("defs");
    const maskCircle = defs.append("clipPath")
        .attr("id", "globe-mask")
        .append("circle")
        .attr("cx", width / 2)
        .attr("cy", height / 2)
        .attr("r", baseScale);

    // 1. Water Layer
    const ocean = svg.append("circle")
        .attr("cx", width / 2)
        .attr("cy", height / 2)
        .attr("r", baseScale)
        .attr("fill", "#1a5e8f");

    // 2. Land/Grid Group (Masked)
    const globeContent = svg.append("g")
        .attr("clip-path", "url(#globe-mask)");

    const graticule = d3.geoGraticule();
    globeContent.append("path")
        .datum(graticule)
        .attr("class", "graticule")
        .attr("d", path);

    Promise.all([
        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"),
        fetch("https://restcountries.com/v3.1/all?fields=name,flags,ccn3,capital,population,region")
            .then(res => res.json())
    ]).then(([topoData, apiData]) => {

        const countries = topojson.feature(topoData, topoData.objects.countries).features;

        const land = globeContent.selectAll(".country")
            .data(countries)
            .enter()
            .append("path")
            .attr("class", "country")
            .attr("d", path)
            .on("click", function(event, d) {
                globeContent.selectAll(".country").style("fill", null);
                d3.select(this).style("fill", "#ff4d4d");

                const match = apiData.find(c => c.ccn3 === d.id.toString().padStart(3, '0'));
                if (match) updatePanel(match);
            });

        // --- FIXED INTERACTION LOGIC ---

        // Define Zoom behavior with strict limits
        const zoom = d3.zoom()
            .scaleExtent([0.8, 2.5]) // Prevents zooming out too small or in too large
            .on("zoom", (event) => {
                const newScale = baseScale * event.transform.k;
                projection.scale(newScale);

                // Keep the blue background and the mask in sync with the zoom
                ocean.attr("r", newScale);
                maskCircle.attr("r", newScale);

                refresh();
            });

        const drag = d3.drag().on("drag", (event) => {
            rotationTimer.stop();
            const rotate = projection.rotate();
            const k = 75 / projection.scale();
            projection.rotate([rotate[0] + event.dx * k, rotate[1] - event.dy * k]);
            refresh();
        });

        // Apply behaviors
        svg.call(drag).call(zoom);

        function refresh() {
            svg.selectAll("path").attr("d", path);
        }

        // Auto-Spin
        rotationTimer = d3.timer(() => {
            const r = projection.rotate();
            projection.rotate([r[0] + 0.15, r[1]]);
            refresh();
        });

    }).catch(err => console.error(err));

    function updatePanel(c) {
        document.getElementById("details").innerHTML = `
                <img src="${c.flags.png}" width="150">
                <h2 style="margin: 0;">${c.name.common}</h2>
                <p><strong>Capital:</strong> ${c.capital[0] || 'N/A'}</p>
                <p><strong>Population:</strong> ${c.population.toLocaleString()}</p>
                <p><strong>Region:</strong> ${c.region}</p>
            `;
    }
</script>
</body>
</html>
